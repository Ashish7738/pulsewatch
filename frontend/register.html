<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · PulseWatch</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('pulsewatch_theme') || 'dark';</script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="flex items-center justify-center p-4">
  <main class="w-full max-w-sm">
    <h1 class="text-3xl font-semibold mb-1">Create your account</h1>
    <p class="muted mb-6">You will be logged in as soon as it is created.</p>

    <form id="auth-form" data-mode="register" class="card space-y-4" novalidate>
      <div id="form-error" class="form-error" role="alert" hidden></div>
      <div>
        <label for="email" class="block text-sm mb-1">Email</label>
        <input id="email" name="email" type="email" class="input" autocomplete="email" required>
      </div>
      <div>
        <label for="password" class="block text-sm mb-1">Password (8+ characters)</label>
        <input id="password" name="password" type="password" class="input" autocomplete="new-password" minlength="8" required>
      </div>
      <div>
        <label for="confirm" class="block text-sm mb-1">Confirm password</label>
        <input id="confirm" name="confirm" type="password" class="input" autocomplete="new-password" required>
      </div>
      <button id="submit-btn" type="submit" class="btn w-full">Create account</button>
    </form>

    <p class="muted text-sm mt-4 text-center">
      Already registered? <a class="link" href="index.html">Log in</a>
    </p>
  </main>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
